# Docker Compose configuration for local development.
# For production, remove the bind mount and the --reload flag.

services:
  estimator:
    build: .
    container_name: estimator
    ports:
      - "8000:8000"

    # Load environment variables (API keys, config) from the local .env file.
    env_file:
      - .env

    # Override REDIS_URL for the in-network Redis service. The .env value
    # (redis://localhost:6379) is meant for running uvicorn outside Docker.
    environment:
      REDIS_URL: redis://redis:6379

    depends_on:
      redis:
        condition: service_healthy

    # Bind-mount the app/ directory so code changes are reflected immediately
    # inside the container without rebuilding the image.
    volumes:
      - ./app:/app/app

    # Override the default CMD to enable auto-reload on file changes.
    # Remove --reload for production deployments.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    restart: unless-stopped

    # Health check using Python's stdlib (curl is not available in slim images).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Streamlit UI (frontal). Same image as the backend; talks to the estimator
  # service through the compose network, not localhost.
  ui:
    build: .
    container_name: estimator-ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      ESTIMATOR_API_BASE_URL: http://estimator:8000
    depends_on:
      estimator:
        condition: service_healthy
    volumes:
      - ./ui:/app/ui
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # AI service (Session 07): embedding pipeline for historical budgets.
  # Reuses the same image; the working dir switch makes `app.main` resolve to
  # servicio_ia/app instead of the estimator's app/. The bind mount enables
  # --reload during development.
  servicio_ia:
    build: .
    container_name: servicio-ia
    ports:
      - "8001:8001"
    env_file:
      - .env
    working_dir: /app/servicio_ia
    volumes:
      - ./servicio_ia:/app/servicio_ia
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: estimator-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  redis_data:
